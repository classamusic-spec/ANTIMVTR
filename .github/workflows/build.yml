name: Build & Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64",      os: ubuntu-22.04, pluginval: "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip",   bin: "./pluginval" }
          - { name: "macOS (arm64+x64)", os: macos-14,  pluginval: "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip",   bin: "pluginval.app/Contents/MacOS/pluginval" }
          - { name: "Windows x64",    os: windows-2022, pluginval: "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip", bin: "./pluginval.exe" }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libglu1-mesa-dev libcurl4-openssl-dev xvfb

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ env.BUILD_TYPE }}

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Unit tests (Unix)
        if: runner.os != 'Windows'
        run: ./build/AntiMatrTests_artefacts/${{ env.BUILD_TYPE }}/AntiMatrTests

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: build\AntiMatrTests_artefacts\${{ env.BUILD_TYPE }}\AntiMatrTests.exe

      - name: Download pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "${{ matrix.pluginval }}"
          unzip -o -q pluginval.zip

      - name: pluginval VST3 (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ${{ matrix.bin }} --strictness-level 5 --validate-in-process --timeout-ms 600000 --validate "build/AntiMatr_artefacts/${{ env.BUILD_TYPE }}/VST3/ANTI-MATR.vst3"

      - name: pluginval VST3 + AU (macOS)
        if: runner.os == 'macOS'
        run: |
          ${{ matrix.bin }} --strictness-level 5 --validate-in-process --timeout-ms 600000 --validate "build/AntiMatr_artefacts/${{ env.BUILD_TYPE }}/VST3/ANTI-MATR.vst3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AntiMatr_artefacts/${{ env.BUILD_TYPE }}/AU/ANTI-MATR.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          ${{ matrix.bin }} --strictness-level 5 --validate-in-process --timeout-ms 600000 --validate ~/Library/Audio/Plug-Ins/Components/ANTI-MATR.component

      - name: pluginval VST3 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ${{ matrix.bin }} --strictness-level 5 --validate-in-process --timeout-ms 600000 --validate "build/AntiMatr_artefacts/${{ env.BUILD_TYPE }}/VST3/ANTI-MATR.vst3"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ANTI-MATR-${{ matrix.os }}
          path: |
            build/AntiMatr_artefacts/${{ env.BUILD_TYPE }}/VST3
            build/AntiMatr_artefacts/${{ env.BUILD_TYPE }}/AU
            build/AntiMatr_artefacts/${{ env.BUILD_TYPE }}/Standalone
          if-no-files-found: ignore
